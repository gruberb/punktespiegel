name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Rust installieren
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0

      - name: Formatierung prüfen
        run: cargo fmt --all --check

      - name: Clippy ausführen
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests ausführen
        run: cargo test --workspace --all-targets --locked

      - name: Datenvertrag prüfen
        run: cargo run --locked -p punktespiegel-data -- --validate-only

  frontend:
    name: React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js installieren
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Offline-Modellcode prüfen
        run: python3 -m compileall -q recommender

      - name: Frontend-Tests ausführen
        run: npm test --workspace frontend

      - name: Produktions-Build erstellen
        run: npm run build

  static-container:
    name: Statischer Container
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compose-Konfiguration prüfen
        run: docker compose config --quiet

      - name: Web-Image bauen
        run: docker compose build web
