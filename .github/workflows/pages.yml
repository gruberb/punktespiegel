name: Daten aktualisieren und Pages bauen

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 12 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Auch abgeschlossene Saisons erneut von der Quelle laden
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Daten und Website erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Rust installieren
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Node.js installieren
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Statische Daten aktualisieren
        run: |
          if [ "${{ inputs.refresh_all }}" = "true" ]; then
            cargo run --locked -p punktespiegel-data -- --refresh-all
          else
            cargo run --locked -p punktespiegel-data
          fi

      - name: Frontend bauen
        run: |
          cargo run --locked -p punktespiegel-data -- --validate-only
          npm ci
          npm run build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Pages-Artefakt bereitstellen
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages aktualisieren
        id: deployment
        uses: actions/deploy-pages@v5
